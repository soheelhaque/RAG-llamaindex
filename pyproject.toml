[project]
name = "rag-llamaindex"
version = "0.1.0"
description = "LlamaIndex RAG familiarisation project"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "faiss-cpu>=1.10.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-retrievers-bm25>=0.5.0",
    "llama-index-vector-stores-faiss>=0.3.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
